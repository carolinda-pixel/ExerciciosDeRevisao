<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício 6</title>
    </head>
    <body>
        <input id="nome" type="text" placeholder="Nome do Contato">
        <input id="tel" type="text" placeholder="Telefone">
        <input id="email" type="email" placeholder="Email">
        <button onclick="cadastrar()">Cadastrar</button>
        <ol id="lista"></ol>
       
        <script>
            function cadastrar(){
                var n = document.getElementById("nome").value;
                var t = document.getElementById("tel").value;
                var e = document.getElementById("email").value;

                if(n == "" || t == "" || e == ""){
                    alert("Preencha todos os campos")
                }else{
                    document.getElementById("lista").innerHTML += "<li>" + n + ", " + t + ", " + e + "   " + "<button onclick='excluir(this)'>Excluir</button>" + "</li>";
                    
                    document.getElementById("nome").value = ""; 
                    document.getElementById("tel").value = ""; 
                    document.getElementById("email").value = "";    
                }
            }

            function excluir(botao){
                botao.parentElement.remove();
            }
        </script>
    </body>
</html>
