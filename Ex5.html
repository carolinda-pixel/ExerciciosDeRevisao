<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício 5</title>
    </head>
    <body>
        <input id="produ" type="text" placeholder="Adicione os produtos aqui:">
        <button onclick="add()">Adicionar</button>
        <ol id="lista"></ol>
       
        <script>
            function add(){
                var n = document.getElementById("produ").value;

                document.getElementById("lista").innerHTML += "<li>" + n + "  " + "<button onclick='comprado(this)'>Comprado</button>" + "  " + "<button onclick='excluir(this)'>Excluir</button>" + "</li>";
                
                document.getElementById("produ").value = "";    
            }

            function comprado(botao){
                botao.parentElement.style.textDecoration = "line-through";
            }

            function excluir(botao){
                botao.parentElement.remove();
            }
        </script>
    </body>
</html>
