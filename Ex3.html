<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício 3</title>
    </head>
    <body>
        <input id="idade" type="number" placeholder="digite a sua idade">
        <button onclick="verificar()">Verificar</button>
        <p id="resultado"></p>
       
        <script>
            function verificar(){
                var i = document.getElementById("idade").value;
                
                if(i == ""){
                    document.getElementById("resultado").innerHTML = "Preencha o campo obrigatório";
                }else if(i < 0){
                    document.getElementById("resultado").innerHTML = "Ponha um valor válido";
                }else if(i < 18){
                    document.getElementById("resultado").innerHTML = "Você é menor de idade!";
                }else{
                    document.getElementById("resultado").innerHTML = "Você é maior de idade!";
                }
            }
        </script>
    </body>
</html>
